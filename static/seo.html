<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analisador de SEO grátis — Criador</title>
  <meta name="description" content="Descubra por que seu site não aparece no Google: análise de SEO gratuita com nota, lista de correções e plano de ação gerado por inteligência artificial." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#7c5cff" />
  <link rel="canonical" href="{{SITE_URL}}/seo" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Criador" />
  <meta property="og:title" content="Analisador de SEO grátis — Criador" />
  <meta property="og:description" content="Nota de SEO, correções e plano de ação com IA para seu site aparecer mais no Google." />
  <meta property="og:url" content="{{SITE_URL}}/seo" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="brand">✦ Criador</div>
    <a class="tool-link" href="/">💬 Criar conteúdo</a>
    <a class="tool-link active" href="/seo">🔎 Analisador de SEO</a>
  </aside>

  <main class="seo-main">
    <div class="seo-wrap">
      <h1>Seu site aparece no Google?</h1>
      <p class="muted">Cole o endereço do site para receber uma nota de SEO, o que corrigir e um plano de ação com IA.</p>

      <form id="seo-form" class="seo-form">
        <input id="seo-url" type="text" inputmode="url" placeholder="https://meusite.com.br" required />
        <input id="seo-keyword" type="text" placeholder="Assunto principal (opcional): ex. pizzaria em Campinas" />
        <button id="seo-submit" type="submit" class="primary">Analisar</button>
      </form>

      <div id="seo-error" class="banner hidden"></div>

      <section id="seo-report" class="hidden">
        <div class="seo-summary">
          <div id="seo-score" class="score"><span></span><small>/100</small></div>
          <div>
            <div id="seo-final-url" class="muted"></div>
            <div id="seo-counts"></div>
          </div>
        </div>
        <ul id="seo-checks" class="checks"></ul>

        <div class="seo-ai">
          <button id="seo-suggest" type="button" class="primary">✦ Gerar plano de ação com IA</button>
          <div id="seo-plan" class="content"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="/static/markdown.js"></script>
  <script src="/static/seo.js"></script>
</body>
</html>
